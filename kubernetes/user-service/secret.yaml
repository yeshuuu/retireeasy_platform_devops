apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: retireeasy-dev
  labels:
    app: user-service
    app.kubernetes.io/part-of: retireeasy-platform
type: Opaque
stringData:
  # Replace these values before applying to your cluster.
  # For production, use External Secrets Operator or Sealed Secrets.
  datasource-url: "jdbc:postgresql://<POSTGRES-HOST>:5433/retireeasy"
  datasource-username: "postgres"
  datasource-password: "postgres"
