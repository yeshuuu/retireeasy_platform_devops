apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: retireeasy-root
  namespace: argocd
spec:
  project: retireeasy
  source:
    repoURL: https://gitlab.com/YOUR_GITLAB_GROUP/retireeasy-platform.git  # TODO: replace with your actual GitLab repo URL
    targetRevision: HEAD
    path: argocd/bootstrap
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
